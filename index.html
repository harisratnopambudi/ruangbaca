        <h1>Ruang Bacaan: Baca dan Beli Ebook EPUB Online</h1>
        <p>Ruang Bacaan adalah perpustakaan digital pribadi untuk membaca ebook EPUB di HP, tablet, dan laptop. Semua bacaan tersimpan di satu rak buku, dan posisi terakhir yang kamu baca tersinkron otomatis di cloud sehingga bisa dilanjutkan di perangkat mana pun.</p>
        <h2>Fitur Ruang Bacaan</h2>
        <ul>
          <li>Baca ebook EPUB langsung di browser, tanpa instal aplikasi.</li>
          <li>Progres baca tersinkron antarperangkat.</li>
          <li>Bookmark dan stabilo dengan enam warna.</li>
          <li>Tema terang, sepia, dan gelap; atur jenis huruf, ukuran teks, dan margin halaman.</li>
          <li>Unggah file EPUB sendiri setelah membeli ebook di katalog.</li>
        </ul>
        <h2>Katalog Ebook Indonesia</h2>
        <p>Beli ebook langsung di tab Katalog. Harga mulai Rp5.000 per ebook, dengan paket hemat 3 ebook dan 10 ebook. Pembayaran lewat QRIS, buku langsung masuk ke rak setelah pembayaran dikonfirmasi.</p>
        <p>Ruang Bacaan dikelola oleh Haris DevLab. Aktifkan JavaScript di browser untuk menggunakan aplikasi ini.</p>
