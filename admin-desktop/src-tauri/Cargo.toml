[package]
name = "ruangbacaan-admin"
version = "1.0.0"
description = "Ruang Bacaan Admin: kelola pesanan dari desktop"
authors = ["Haris DevLab"]
edition = "2021"

[lib]
name = "ruangbacaan_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
